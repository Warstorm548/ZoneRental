# ZoneRental Configuration
# Complete configuration file for all features

# ============================================
# GENERAL SETTINGS
# ============================================
general:
  # Plugin prefix for all messages
  prefix: '<dark_gray>[<gold>ZoneRental<dark_gray>]<reset> '
  
  # Enable debug mode for troubleshooting
  debug: false
  
  # How often to check for expired rentals (in minutes)
  expiration-check-interval: 1
  
  # Automatic save interval (in minutes)
  auto-save-interval: 5
  
  # Maximum number of pages to show in storage GUI
  max-storage-pages: 10

# ============================================
# COMMAND SETTINGS
# ============================================
commands:
  # Custom command prefix (default: "zr")
  # All commands will use this prefix: /{prefix}info, /{prefix}extend, etc.
  # Examples: "zr" → /zrinfo, "rental" → /rentalinfo, "rent" → /rentinfo
  #
  # Validation rules:
  #   - Lowercase letters and numbers only (a-z, 0-9)
  #   - Length: 2-10 characters
  #   - Invalid prefixes will default to "zr"
  #
  # Conflict handling:
  #   - If custom prefix conflicts: automatically falls back to "zr"
  #   - If "zr" also conflicts: uses "zr1", "zr2", etc.
  #
  # NOTE: Changing prefix requires server restart
  prefix: 'zr'

# ============================================
# ECONOMY SETTINGS
# ============================================
economy:
  # Enable economy features
  enabled: true
  
  # Default rental price
  default-price: 100.0
  
  # Currency format for display
  currency-format: '$%.2f'
  
  # Refund money when admin resets a rental
  refund-on-reset: false
  
  # Refund percentage on early termination (0-100)
  refund-percentage: 0

# ============================================
# DURATION SETTINGS
# ============================================
durations:
  # Default rental duration in days
  default-days: 7
  
  # Available duration options for players
  available-durations:
    - 1
    - 3
    - 7
    - 14
    - 30
  
  # Minimum rental duration (days)
  min-duration: 1
  
  # Maximum rental duration (days)
  max-duration: 90
  
  # Allow custom durations via command
  allow-custom-duration: true
  
  # Time format for duration commands
  # Supports: days, hours, minutes, seconds
  # Short forms: d, h, m, s
  time-format-help: 'Use format: 2 days 3 hours 30 minutes or 2d 3h 30m'

# ============================================
# EXTENSION SETTINGS
# ============================================
extension:
  # Enable rental extensions
  enabled: true

  # Default extension duration in days
  extension-days: 7

  # Price multiplier for extensions (1.0 = same as rental price)
  price-multiplier: 1.0

  # Maximum number of extensions per rental
  max-extensions: 10

  # Minimum time before expiry to allow extension (hours)
  min-time-before-extension: 0

  # Maximum time before expiry to allow extension (hours)
  # Set to -1 for no limit
  max-time-before-extension: -1

  # Refund extension costs when admin resets duration to default
  # Only applies to /rrduration reset command
  refund-on-duration-reset: true

# ============================================
# DURATION COMMAND SETTINGS
# ============================================
duration:
  # Refund players proportionally when time is removed via /rrduration remove
  refund-on-time-removal: true

  # Charge players when admin adds time via /rrduration add <region> <time> --charge
  # If false, admin additions are always free
  charge-for-add: false

  # Bypass extension limits for charged admin additions
  # When true, time added with --charge flag doesn't count toward extension limit
  add-bypass-extension-limit: true

  # Price per day for charged admin additions
  # If 0, uses extension pricing (calculated from region price and duration)
  # If > 0, uses this fixed price per day
  add-price-per-day: 0.0

# ============================================
# RENTAL LIMITS
# ============================================
limits:
  # Maximum rentals per player
  max-rentals-per-player: 3
  
  # Override limits by permission
  # Format: permission: limit
  permission-limits:
    'zonerental.vip': 5
    'zonerental.premium': 10
    'zonerental.unlimited': -1
  
  # Cooldown between rentals (seconds)
  rental-cooldown: 0

# ============================================
# MEMBER MANAGEMENT SETTINGS
# ============================================
members:
  # Enable member management feature
  enabled: true

  # Maximum members per rental (-1 for unlimited)
  max-members: 5

# ============================================
# TELEPORTATION SETTINGS
# ============================================
teleport:
  # Enable /rrtp command to teleport to rented regions
  enabled: true

  # Maximum blocks to search upward for safe teleport location
  max-search-distance: 20

  # How many blocks forward from sign to search for safe location (max: 20)
  forward-search-distance: 5

  # How many blocks downward to search for floor (max: 20)
  floor-search-down: 20

  # How many blocks upward to search for floor if not found below
  floor-search-up: 20

  # Cooldown in seconds between teleports (0 to disable)
  cooldown: 30

  # Show warning when teleporting to different world
  cross-world-warning: true

  # Play sound effect on teleport (ENTITY_ENDERMAN_TELEPORT)
  sound-enabled: true

  # Show particle effect on teleport (PORTAL particles)
  particle-enabled: true

# ============================================
# SIGN SETTINGS
# ============================================
signs:
  # Format for available signs (4 lines max)
  available-format:
    - '<dark_green>[AVAILABLE]'
    - '<gold>{region}'
    - '<yellow>{price}'
    - '<gray>{duration} days'

  # Format for rented signs (4 lines max)
  rented-format:
    - '<red>[RENTED]'
    - '<gold>{region}'
    - '<yellow>{owner}'
    - '<gray>Exp: {expires}'

  # Format for expiring soon signs
  expiring-format:
    - '<gold>[EXPIRING]'
    - '<gold>{region}'
    - '<yellow>{owner}'
    - '<red>{hours}h left'
  
  # Protect rental signs and their support blocks from being broken by players
  # (players with zonerental.admin.breaksign can still break them)
  protect-signs: true

  # Protect rental signs and their support blocks from explosions (creepers, TNT,
  # beds, respawn anchors...), pistons, fire, falling blocks, endermen, withers
  # and leaf decay
  environment-protection: true

  # Maximum number of signs per rental space. -1 = unlimited.
  # 0 or anything below -1 is invalid and falls back to 3.
  max-per-region: 3

  # true  = load a sign's chunk to redraw it when its rental changes
  # false = leave unloaded chunks alone and redraw the sign when its chunk loads
  load-chunks-for-updates: true
  
  # Allow breaking signs with permission
  allow-break-with-permission: true
  
  # Update sign interval (seconds)
  update-interval: 30
  
  # Show expiring warning on signs (hours before expiry)
  expiring-threshold: 24

# ============================================
# STORAGE SETTINGS
# ============================================
storage:
  # Enable item storage when rental expires
  enabled: true

  # Store items from these container types
  store-from-containers: true

  # Store player-placed blocks (blocks different from schematic)
  # Requires block restoration to be enabled
  store-player-blocks: true

  # Blocks to exclude from player block storage (too common/cheap)
  # These blocks will not be stored even if placed by players
  block-blacklist:
    - AIR
    - CAVE_AIR
    - VOID_AIR
    - DIRT
    - GRASS_BLOCK
    - STONE
    - COBBLESTONE
    - GRAVEL
    - SAND
    - SANDSTONE
    - WATER
    - LAVA

  # Container types to scan
  container-types:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - HOPPER
    - DROPPER
    - DISPENSER
    - FURNACE
    - BLAST_FURNACE
    - SMOKER
    - BREWING_STAND
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX
  
  # Maximum storage time before auto-deletion (days)
  # Set to -1 to never delete
  max-storage-time: 30
  
  # Items per page in retrieval GUI
  items-per-page: 45

# ============================================
# BLOCK RESTORATION SETTINGS (WorldEdit)
# ============================================
restoration:
  # Enable block restoration when rental expires
  # Requires WorldEdit to be installed
  enabled: true

  # Automatically delete schematic files after restoration
  # If false, schematics are kept for manual restoration
  auto-delete-schematics: true

  # Maximum number of schematics to keep in memory cache
  # Higher values use more RAM but improve restore performance
  # Schematics are loaded from disk on-demand when not in cache
  schematic-cache-size: 20

  # Restore entities (item frames, armor stands, etc.)
  restore-entities: true

  # Restore biomes (may impact performance)
  restore-biomes: false

  # Capture region state on rental creation
  # If false, only restoration requests will be manual
  auto-capture-on-rent: true

  # Maximum schematic file size (MB) to prevent memory issues
  # Set to -1 for no limit
  max-schematic-size: 50
  
  # Enable multi-page GUI for large storages
  enable-multi-page: true
  
  # GUI title format
  gui-title: 'Retrieved Items - Page {page}/{total}'
  
  # Single page GUI title
  gui-title-single: 'Retrieve Your Items'

# ============================================
# RESTORATION SETTINGS
# ============================================
restoration:
  # Enable block restoration on rental expiry
  enabled: true
  
  # Save region state when rented
  save-on-rent: true
  
  # Restore region state when expired
  restore-on-expire: true
  
  # Blocks to exclude from restoration
  excluded-blocks:
    - BEDROCK
    - COMMAND_BLOCK
    - BARRIER
    - STRUCTURE_BLOCK

# ============================================
# ASYNC SCANNING SETTINGS
# ============================================
# Optimizes block/item scanning for large regions using
# ChunkSnapshot pre-filtering and TPS-aware batching.
async-scanning:
  # Enable async scanning optimization
  enabled: true

  # Minimum chunks in region to use async scanning
  # Smaller regions use sync scanning for lower overhead
  min-chunks-for-async: 10

  # TPS thresholds for auto-throttling
  # Scanning slows down when TPS drops below these values
  tps-healthy-threshold: 19.5
  tps-warning-threshold: 18.5

  # Enable debug logging for async operations
  debug-async: false

  # Maximum region size in chunks for rentals
  # Regions larger than this cannot be rented (prevents server lag)
  # 2000 chunks = ~720x720 blocks
  max-rental-chunks: 2000

# ============================================
# NOTIFICATION SETTINGS
# ============================================
notifications:
  # Enable title notifications
  title-enabled: true
  
  # Enable sound notifications
  sound-enabled: true
  
  # Enable action bar notifications
  actionbar-enabled: false
  
  # Warning times before expiration (in hours)
  warning-times:
    - 72    # 3 days
    - 48    # 2 days
    - 24    # 1 day
    - 12    # 12 hours
    - 6     # 6 hours
    - 3     # 3 hours
    - 1     # 1 hour
  
  # Sound to play for notifications
  notification-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  
  # Sound volume
  sound-volume: 1.0
  
  # Sound pitch
  sound-pitch: 1.0

# ============================================
# MESSAGES
# ============================================
messages:
  # Permission messages
  no-permission: '<red>You don''t have permission to do that!'

  # Region messages
  region-not-found: '<red>Region <yellow>{region}<red> not found!'
  region-not-setup: '<red>Region <yellow>{region}<red> is not set up for rental!'
  invalid-region-format: '<red>Invalid format! Console must use world:region format (e.g., world:shop1)'
  region-not-found-in-world: '<red>Region <yellow>{region}<red> not found in world <yellow>{world}<red>!'
  region-too-large: '<red>Region <yellow>{region}<red> is too large to rent! (<yellow>{chunks}<red> chunks, max: <yellow>{max}<red>)'

  # Rental messages
  already-rented: '<red>This region is already rented!'
  rental-success: '<green>You have successfully rented <yellow>{region}<green> for <yellow>{days}<green> days!'
  rental-expired: '<red>Your rental of <yellow>{region}<red> has expired!'
  rental-expiring-soon: '<yellow>Your rental of <gold>{region}<yellow> expires in <red>{time}!'
  not-your-rental: '<red>You don''t own this rental!'

  # Economy messages
  not-enough-money: '<red>You don''t have enough money! Need <yellow>{amount}'
  economy-disabled: '<red>Economy features are disabled!'
  refund-given: '<green>You have been refunded <yellow>{amount}<green>!'

  # Limit messages
  max-rentals-reached: '<red>You have reached the maximum number of rentals! ({current}/{max})'
  cooldown-active: '<red>Please wait <yellow>{seconds}<red> seconds before renting again!'

  # Extension messages
  rental-extended: '<green>Rental for <yellow>{region}<green> extended for <yellow>{days}<green> days!'
  max-extensions-reached: '<red>Maximum extensions reached for this rental! ({current}/{max})'
  extension-too-early: '<red>You can only extend rentals within <yellow>{hours}<red> hours of expiry!'
  extension-disabled: '<red>Extensions are disabled!'

  # Duration command messages
  duration-added: '<green>Added <yellow>{time}<green> to rental <gold>{region}'
  duration-removed: '<green>Removed <yellow>{time}<green> from rental <gold>{region}'
  duration-set: '<green>Set rental duration for <gold>{region}<green> to <yellow>{time}'
  duration-invalid: '<red>Invalid duration format! Example: 2 days 3 hours 30 minutes'
  duration-too-short: '<red>Duration would expire the rental immediately!'

  # Duration command refund/charge messages
  duration-add-charged: '<green>Added <yellow>{days}<green> days to <yellow>{region}<green>. Player <yellow>{player}<green> was charged <yellow>{amount}<green>.'
  duration-add-free: '<green>Added <yellow>{days}<green> to <yellow>{region}<green> (no charge).'
  duration-remove-refunded: '<green>Removed <yellow>{days}<green> days from <yellow>{region}<green>. Player <yellow>{player}<green> was refunded <yellow>{amount}<green>.'
  duration-remove-no-refund: '<green>Removed <yellow>{days}<green> days from <yellow>{region}<green> (no refund issued).'

  # Refund tracking messages
  refund-issued: '<green>Refund issued to <yellow>{player}<green>: <yellow>{amount}<green> (Reason: {reason})'
  refund-already-given: '<red>Cannot refund. Total refunded (<yellow>{refunded}<red>) would exceed total paid (<yellow>{paid}<red>).'
  refund-history-header: '<green><bold>Refund History for <yellow>{region}'
  refund-partial: '<green>Proportional refund for <yellow>{days}<green> days removed: <yellow>{amount}'

  # Storage messages
  items-stored: '<green>Your <yellow>{count}<green> items from <gold>{region}<green> have been stored!'
  items-stored-pages: '<green>Your items are stored across <yellow>{pages}<green> pages!'
  items-retrieved: '<green>You have retrieved your stored items!'
  no-stored-items: '<red>You have no stored items!'
  storage-expired: '<red>Your stored items have expired and been deleted!'

  # Sign messages
  sign-created: '<green>Rental sign <yellow>#{id}<green> created for <yellow>{region}<green>!'
  sign-removed: '<green>Rental sign <yellow>#{id}<green> removed from <yellow>{region}<green>.'
  sign-not-found: '<red>Rental space <yellow>{region}<red> has no sign <yellow>#{id}<red>!'
  sign-not-rental: '<red>This is not a rental sign!'
  sign-already-registered: '<red>This sign is already rental sign <yellow>#{id}<red> of <yellow>{region}<red>!'
  sign-limit-reached: '<red>Rental space <yellow>{region}<red> already has the maximum of <yellow>{max}<red> signs!'
  region-registered: '<green>Rental space <yellow>{region}<green> created. Add signs with the createsign command.'
  region-already-registered: '<red>Rental space <yellow>{region}<red> is already registered!'
  region-not-registered: '<red>Region <yellow>{region}<red> is not a rental space!'
  sign-protected: '<red>Rental signs are protected!'
  sign-support-protected: '<red>You cannot break this block - it supports a rental sign!'

  # Admin messages
  rental-reset: '<green>Rental for <yellow>{region}<green> has been reset!'
  admin-reset-success: '<green>Successfully reset rental for <yellow>{region}<green>. Player <yellow>{player}<green> has been refunded <yellow>{amount}<green>.'
  rental-reset-refund: '<green>Your rental of <yellow>{region}<green> has been reset by an admin. You have been refunded <yellow>{amount}<green>.'
  region-removed: '<green>ZoneRental setup completely removed from <yellow>{region}<green>:'
  rental-info: '<gold>=== Rental Info for {region} ==='
  config-reloaded: '<green>Configuration reloaded!'
  aliases-enabled: '<green>Short command aliases have been enabled!'
  aliases-disabled: '<yellow>Short aliases disabled due to conflicts. Use /zr prefix.'

  # Member management messages
  member-added: '<green>Added <yellow>{member}<green> as a member of <gold>{region}<green>!'
  member-removed: '<green>Removed <yellow>{member}<green> from <gold>{region}<green>!'
  member-already-added: '<red>Player <yellow>{member}<red> is already a member!'
  member-not-found: '<red>Player <yellow>{member}<red> is not a member!'
  member-limit-reached: '<red>Member limit reached! ({current}/{max})'
  member-management-disabled: '<red>Member management is disabled!'
  cannot-add-self: '<red>You cannot add yourself as a member!'
  members-list-header: '<gold>=== Members of {region} ==='
  members-list-entry: '<yellow>  - {member}'
  members-list-empty: '<gray>No members added'
  members-list-footer: '<gray>Total: {count}/{max} members'
  member-added-notify: '<green>You were added as member of <gold>{region}<green> by <yellow>{owner}<green>!'
  member-removed-notify: '<red>You were removed from <gold>{region}<red> by <yellow>{owner}<red>!'

  # Teleport messages
  tp-success: '<green>Teleported to <yellow>{region}<green>!'
  tp-no-permission: '<red>You don''t have permission to teleport to <yellow>{region}<red>!'
  tp-not-rented: '<red>Region <yellow>{region}<red> is not currently rented!'
  tp-no-safe-location: '<red>No safe teleport location found for <yellow>{region}<red>!'
  tp-cooldown: '<red>You must wait <yellow>{time}<red> seconds before teleporting again!'
  tp-cross-world-warning: '<yellow>Warning: Teleporting to <gold>{region}<yellow> in world <gold>{world}<yellow>!'
  not-rental-owner: '<red>You do not own this rental!'

  # Help messages
  help-header: '<gold>=== ZoneRental Help ==='
  help-footer: '<gold>======================='

# ============================================
# REGIONS CONFIGURATION FILE SETTINGS
# ============================================
regions-config:
  # Automatically verify regions.yml on startup/reload
  # Reports orphaned configs (custom settings without signs)
  auto-verify-regions: true

  # Enable /rrverify command for manual verification
  # Shows which regions use defaults vs custom overrides
  enable-verify-command: true

# ============================================
# PLUGIN INTEGRATIONS
# ============================================
integration:
  # EzChestShop Integration
  ezchestshop:
    # Enable automatic shop removal when rentals expire
    enabled: true

    # Notify player when shops are removed
    notify-on-removal: true

    # Custom message for shop removal (supports {region} placeholder)
    removal-message: '<yellow>Chest shops in <gold>{region}<yellow> have been removed due to rental expiration.'

# ============================================
# PER-REGION CUSTOM OVERRIDES
# ============================================
# IMPORTANT: Use /rroverride commands to set region-specific settings
# Regions NOT in regions.yml will use the default values above
#
# Commands to customize regions:
#   /rroverride price <region> <amount>
#   /rroverride duration <region> <days>
#   /rroverride maxextensions <region> <count>
#   /rroverride extensionprice <region> <amount>
#   /rroverride allowextensions <region> <true|false>
#   /rroverride extensionduration <region> <days>
#   /rroverride list [region]              # View current overrides
#   /rroverride remove <region>            # Remove all overrides
#
# Regions with custom overrides are stored in regions.yml
# Use /rrverify to see which regions use defaults vs custom settings
#
# Migration: Any existing regions: data will be automatically migrated
# to regions.yml on first startup and removed from this file.

# ============================================
# PERMISSION-BASED PRICING
# ============================================
# Give discounts based on permissions
permission-prices:
  # 'zonerental.vip': 50.0      # 50% of normal price
  # 'zonerental.premium': 75.0   # 75% of normal price
  # 'zonerental.special': 25.0   # 25% of normal price

# ============================================
# DEBUG OPTIONS
# ============================================
debug-options:
  # Log rental transactions
  log-rentals: false
  
  # Log expiration checks
  log-expirations: false
  
  # Log extension attempts
  log-extensions: false
  
  # Log storage operations
  log-storage: false
  
  # Log sign updates
  log-signs: false
  
  # Log command usage
  log-commands: false
  
  # Log alias registration
  log-aliases: false

# ============================================
# ADVANCED SETTINGS
# ============================================
advanced:
  # Use async operations where possible
  use-async: true
  
  # Cache rental data
  use-cache: true
  
  # Cache timeout (minutes)
  cache-timeout: 5
  
  # Database settings (future feature)
  database:
    enabled: false
    type: SQLITE  # SQLITE, MYSQL, POSTGRESQL
    host: localhost
    port: 3306
    database: zonerental
    username: root
    password: password
    
# End of configuration
