name: ZoneRental
version: 3.3.0
main: com.zonerental.ZoneRental
api-version: '1.21'
author: Jean-Luc
description: WorldGuard Region Rental System with Clickable Signs
website: https://yourwebsite.com

depend:
  - Vault
  - WorldGuard
  - WorldEdit

softdepend:
  - LuckPerms
  - EzChestShopReborn

commands:
  zr:
    description: ZoneRental - Rent WorldGuard regions. Type /zr for help
    usage: /zr
    permission: zonerental.user

# Commands are registered dynamically at runtime with configurable prefix
# Default prefix: 'zr' (can be changed in config.yml)
# Commands will be registered as: /{prefix}info, /{prefix}extend, etc.
# The 'zr' prefix is always kept as a fallback for backward compatibility

permissions:
  zonerental.*:
    description: All ZoneRental permissions
    default: op
    children:
      zonerental.admin.*: true
      zonerental.user.*: true

  zonerental.admin.*:
    description: All admin permissions
    default: op
    children:
      zonerental.admin.reload: true
      zonerental.admin.create: true
      zonerental.admin.createsign: true
      zonerental.admin.reset: true
      zonerental.admin.duration: true
      zonerental.admin.remove: true
      zonerental.admin.refundhistory: true
      zonerental.admin.verify: true
      zonerental.admin.override: true
      zonerental.admin.group: true
      zonerental.admin.bypass: true
      zonerental.admin.breaksign: true
      zonerental.admin.list.others: true

  zonerental.user.*:
    description: All user permissions
    default: true
    children:
      zonerental.rent: true
      zonerental.extend: true
      zonerental.retrieve: true
      zonerental.info: true
      zonerental.list: true
      zonerental.member: true
      zonerental.members: true
      zonerental.tp: true

  zonerental.rent:
    description: Rent regions
    default: true

  zonerental.extend:
    description: Extend rentals
    default: true

  zonerental.retrieve:
    description: Retrieve stored items
    default: true

  zonerental.info:
    description: View rental information
    default: true

  zonerental.list:
    description: List your rentals
    default: true

  zonerental.member:
    description: Add and remove members in rented regions
    default: true

  zonerental.members:
    description: View members of rented regions (used by /zrmember list)
    default: true

  zonerental.tp:
    description: Teleport to rented regions
    default: true

  zonerental.admin.reload:
    description: Reload the plugin
    default: op

  zonerental.admin.create:
    description: Register regions as rental spaces
    default: op

  zonerental.admin.createsign:
    description: Create rental signs
    default: op

  zonerental.admin.reset:
    description: Reset rentals
    default: op

  zonerental.admin.duration:
    description: Modify rental duration
    default: op

  zonerental.admin.remove:
    description: Remove rental signs or the ZoneRental setup of a region
    default: op

  zonerental.admin.verify:
    description: Verify and repair region configurations
    default: op

  zonerental.admin.override:
    description: Set per-region custom rental settings
    default: op

  zonerental.admin.group:
    description: Manage region groups for bulk overrides
    default: op

  zonerental.admin.refundhistory:
    description: View refund history for rentals
    default: op

  zonerental.user:
    description: Basic user permission for help commands
    default: true

  zonerental.admin.bypass:
    description: Bypass rental restrictions
    default: op

  zonerental.admin.breaksign:
    description: Break rental signs
    default: op

  zonerental.admin.list.others:
    description: List other players' rentals
    default: op
