name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle 9.2.0
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.2.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build

    - name: Run tests
      run: ./gradlew test

    - name: Extract version from build.gradle.kts
      id: version
      run: |
        VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
        VERSION_SAFE=$(echo "$VERSION" | tr '.' '-')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_safe=$VERSION_SAFE" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION (safe: $VERSION_SAFE)"

    - name: Verify JAR contains Kotlin runtime
      run: |
        JAR_FILE=$(ls build/libs/ZoneRental-*.jar | head -1)
        echo "Checking JAR: $JAR_FILE"

        # Check JAR size (should be >1MB with Kotlin shaded)
        JAR_SIZE=$(stat -f%z "$JAR_FILE" 2>/dev/null || stat -c%s "$JAR_FILE")
        echo "JAR size: $JAR_SIZE bytes"

        # Verify Kotlin classes are present (shaded location)
        if unzip -l "$JAR_FILE" | grep -q "com/zonerental/shaded/kotlin"; then
          echo "✓ Kotlin stdlib is properly shaded"
        else
          echo "✗ ERROR: Kotlin stdlib not found in JAR!"
          echo "Listing JAR contents for debugging:"
          unzip -l "$JAR_FILE" | head -50
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ZoneRental-${{ steps.version.outputs.version_safe }}
        path: build/libs/*.jar
        retention-days: 30

    - name: Build summary
      if: always()
      run: |
        echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Java Version:** OpenJDK 21" >> $GITHUB_STEP_SUMMARY
        echo "- **Gradle Version:** 9.2.0" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

        JAR_FILE=$(ls build/libs/ZoneRental-*.jar 2>/dev/null | head -1)
        if [ -n "$JAR_FILE" ]; then
          JAR_SIZE=$(stat -c%s "$JAR_FILE" 2>/dev/null || stat -f%z "$JAR_FILE")
          JAR_SIZE_MB=$(echo "scale=2; $JAR_SIZE / 1048576" | bc)
          echo "- **JAR Size:** ${JAR_SIZE_MB} MB" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts:** Built successfully" >> $GITHUB_STEP_SUMMARY
        fi
